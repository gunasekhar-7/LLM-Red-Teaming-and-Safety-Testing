[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guards"
version = "0.1.0"
description = "Defensive guard layers for LLM safety"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "regex>=2024.5.0",
    "transformers>=4.38.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "locust>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guards"]