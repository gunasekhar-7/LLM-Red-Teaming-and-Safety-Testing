global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'reference-rag'
    static_configs:
      - targets: ['reference-rag:8000']
    metrics_path: '/metrics'

  - job_name: 'existing-rag-mock'
    static_configs:
      - targets: ['existing-rag-mock:8001']
    metrics_path: '/metrics'

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: '/metrics'

  - job_name: 'test-runner'
    static_configs:
      - targets: ['test-runner:8080']
    metrics_path: '/metrics'