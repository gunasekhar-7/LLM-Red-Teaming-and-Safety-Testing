[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Production-ready LLM Red-Teaming Framework for RAG Applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LLM Red-Teaming Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rag-target",
    "llm-provider",
    "guards",
    "test-harness",
    "existing-rag-adapter",
    "reference-rag",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest-html>=4.1.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.90.0",
]
dashboard = [
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "streamlit-aggrid>=1.0.0",
]

[project.scripts]
llm-redteam = "llm_redteam_cli:app"

[tool.uv.workspace]
members = ["libs/*", "apps/*"]

[tool.uv.sources]
rag-target = { workspace = true }
llm-provider = { workspace = true }
guards = { workspace = true }
test-harness = { workspace = true }
existing-rag-adapter = { workspace = true }
reference-rag = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/llm_redteam_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "libs", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "SIM", "T20"]
ignore = ["E501", "T201", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/write_templates.py" = ["E402", "W291", "W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
mypy_path = [
    "src",
    "libs/rag-target/src",
    "libs/llm-provider/src",
    "libs/guards/src",
    "libs/test-harness/src",
    "apps/reference-rag/src",
    "apps/existing-rag-adapter/src",
]
exclude = ["scripts/write_templates\\.py$"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    "src",
    "libs/rag-target/src",
    "libs/llm-provider/src",
    "libs/guards/src",
    "libs/test-harness/src",
    "apps/reference-rag/src",
    "apps/existing-rag-adapter/src",
    ".",
]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_api: Tests requiring API keys",
]

[tool.coverage.run]
source = [
    "src",
    "libs/rag-target/src",
    "libs/llm-provider/src",
    "libs/guards/src",
    "libs/test-harness/src",
    "apps/reference-rag/src",
    "apps/existing-rag-adapter/src",
]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
