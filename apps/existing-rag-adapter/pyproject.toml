[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "existing-rag-adapter"
version = "0.1.0"
description = "Adapter for existing LangChain RAG application"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "rag-target",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "pydantic>=2.6.0",
    "httpx>=0.26.0",
    "guards",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/existing_rag_adapter"]
